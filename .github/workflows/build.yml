
      - name: Update Gemini model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("unpack/JARVIS_Gemini_Android/app/src/main/java/de/dirk/jarvis/MainActivity.kt")
          s = p.read_text()
          s = s.replace("gemini-2.5-flash", "gemini-3.8-flash")
          p.write_text(s)
          PY
