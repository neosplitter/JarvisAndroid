name: Build JARVIS Gemini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager nicht gefunden"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Gemini project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*Gemini*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine Gemini-ZIP-Datei im Hauptverzeichnis gefunden!"
            exit 1
          fi
          echo "Entpacke $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d unpack
          test -d unpack/JARVIS_Gemini_Android

      - name: Fix Java, Kotlin and Gemini Model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Java/Kotlin auf 17 setzen
          p = Path("unpack/JARVIS_Gemini_Android/app/build.gradle.kts")
          s = p.read_text()
          s = re.sub(r'JavaVersion\.VERSION_1_[0-9]+', 'JavaVersion.VERSION_17', s)
          s = re.sub(r'jvmTarget\s*=\s*"1\.[0-9]+"', 'jvmTarget = "17"', s)

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
              )
          if "kotlinOptions" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n"
              )
          p.write_text(s)

          # 2. Gezielt nur den Modell-String in MainActivity.kt anpassen
          kt = Path("unpack/JARVIS_Gemini_Android/app/src/main/java/de/dirk/jarvis/MainActivity.kt")
          if kt.exists():
              code = kt.read_text()
              for line in code.splitlines():
                  if "gemini" in line.lower() or "generateContent" in line:
                      print("VORHER:", line.strip())

              # Ersetzt nur Modellnamen wie "gemini-1.5-pro", "gemini-2.5-pro", "gemini-2.0-flash-lite" etc.
              code = re.sub(r'gemini-(1\.5|2\.0|2\.5|3\.0)-[a-zA-Z0-9\-\.]+', 'gemini-2.5-flash', code)
              # Falls v1beta statt v1 genutzt werden muss, sicherstellen:
              code = code.replace('/v1/models/', '/v1beta/models/')

              kt.write_text(code)
              for line in code.splitlines():
                  if "gemini" in line.lower() or "generateContent" in line:
                      print("NACHHER:", line.strip())
          PY

      - name: Build APK
        run: |
          cd unpack/JARVIS_Gemini_Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-GEMINI-APK
          path: unpack/JARVIS_Gemini_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
