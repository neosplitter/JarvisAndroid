
name: Build JARVIS Gemini APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Gemini project
        run: |
          unzip -q JARVIS_Gemini_Android_Projekt.zip -d unpack

      - name: Build Gemini APK
        run: |
          cd unpack/JARVIS_Gemini_Android
          gradle --no-daemon assembleDebug

      - name: Upload Gemini APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-GEMINI-APK
          path: unpack/JARVIS_Gemini_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
